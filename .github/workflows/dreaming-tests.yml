name: Dreaming core and OMA HTTP adapter

on:
  push:
    branches:
      - feat/claude-dreaming
    paths:
      - 'internal/dreams/**'
      - 'internal/dreamclient/**'
      - 'cmd/dream/**'
      - '.github/workflows/dreaming-tests.yml'
  pull_request:
    paths:
      - 'internal/dreams/**'
      - 'internal/dreamclient/**'
      - 'cmd/dream/**'
      - '.github/workflows/dreaming-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreaming-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify runner execution without downloaded actions
        run: |
          set -eu
          uname -srm
          git --version
          go version
  dreaming:
    needs: runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l internal/dreams internal/dreamclient cmd/dream)"
      - name: Vet new packages
        run: go vet ./internal/dreams ./internal/dreamclient ./cmd/dream
      - name: Run deterministic protocol and engine tests
        run: go test -race -count=1 -cover ./internal/dreams ./internal/dreamclient ./cmd/dream
