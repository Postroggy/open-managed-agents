name: Dreaming core and OMA HTTP adapter

on:
  push:
    branches:
      - feat/claude-dreaming
    paths:
      - 'internal/dreams/**'
      - 'internal/dreamclient/**'
      - 'cmd/dream/**'
      - '.github/workflows/dreaming-tests.yml'
  pull_request:
    paths:
      - 'internal/dreams/**'
      - 'internal/dreamclient/**'
      - 'cmd/dream/**'
      - '.github/workflows/dreaming-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreaming-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dreaming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l internal/dreams internal/dreamclient cmd/dream)"
      - name: Vet new packages
        run: go vet ./internal/dreams ./internal/dreamclient ./cmd/dream
      - name: Run deterministic protocol and engine tests
        run: go test -race -count=1 -cover ./internal/dreams ./internal/dreamclient ./cmd/dream
